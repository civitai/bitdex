[package]
name = "scratch"
version = "0.0.0"
edition = "2021"
publish = false

# Scratch crate for throwaway microbenchmarks and experiments.
#
# Agents: write your hypothesis-testing benchmarks here, NOT in tests/*.rs.
# Files in tests/ get compiled+linked on every `cargo test` and slow down
# the entire test suite.
#
# Usage:
#   cargo test -p scratch                    # run all scratch tests
#   cargo test -p scratch --release -- --nocapture bench_name
#   cargo run -p scratch --bin my_bench      # if you add a [[bin]]
#
# Feel free to add dependencies as needed. This crate is disposable.

[dependencies]
roaring = { path = "C:/Dev/Repos/open-source/roaring-rs/roaring" }
dashmap = "6"
parking_lot = "0.12"
rand = "0.8"
rayon = "1"
memmap2 = "0.9"
datasilo = { path = "../crates/datasilo" }
tempfile = "3"
rmp-serde = "1"
rmpv = "1"
crc32fast = "1"
ahash = "0.8"

[[bin]]
name = "frozen_merge_bench"
path = "src/bin/frozen_merge_bench.rs"

[[bin]]
name = "filter_insert_bench"
path = "src/bin/filter_insert_bench.rs"

[[bin]]
name = "bitmap_merge_strategies"
path = "src/bin/bitmap_merge_strategies.rs"
