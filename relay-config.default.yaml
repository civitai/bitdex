# Default relay-mode config shipped with the bitdex-v2 image.
#
# At container startup, when BITDEX_MODE=relay, this file is loaded from
# /etc/bitdex/relay-config.yaml (override path with BITDEX_RELAY_CONFIG).
#
# Routes mirror the bitdex-server HTTP surface so existing callers
# (PG-sync sidecar, model-share comparator, K8s probes) keep working.
#
# Design ref: docs/_in/relay-system-design.md

listen: 0.0.0.0:3000
metrics_path: /metrics
admin_token_env: BITDEX_ADMIN_TOKEN
max_body_bytes: 4194304   # 4 MiB default; per-route override below

channels:
  queries:
    capacity: 10000
    keep_alive_seconds: 15
  ops:
    capacity: 50000
    keep_alive_seconds: 15

routes:
  # Query route — public-equivalent today, no auth on bitdex-server either.
  # Returns the tee_mode:true stub the model-share comparator must skip on.
  - path: /api/indexes/{index}/query
    methods: [POST]
    auth: none
    emit:
      channel: queries
      payload: |
        {"seq_id":{seq_id},"ts_ms":{ts_ms},"index":"{path.index}","body":{body|json}}
    response:
      status: 200
      headers:
        Content-Type: application/json
      body: '{"ids":[],"total_matched":0,"cursor":null,"tee_mode":true}'

  # Ops route — pg-sync sidecar over loopback bypasses; external requires bearer.
  # 32 MiB body limit because pg-sync can batch large at 10K ops/sec.
  - path: /api/indexes/{index}/ops
    methods: [POST]
    auth: loopback_or_bearer
    max_body_bytes: 33554432
    emit:
      channel: ops
      payload: |
        {"seq_id":{seq_id},"ts_ms":{ts_ms},"index":"{path.index}","body":{body|json}}
    # No `response` block → empty 200 OK by default. pg-sync's
    # bitdex_client only checks status().is_success() (Donovan verified).

  # Health probe — K8s reads {"status":"ok"} shape.
  - path: /api/health
    methods: [GET]
    auth: none
    response:
      status: 200
      headers:
        Content-Type: application/json
      body: '{"status":"ok","mode":"relay"}'

  # ── pg-sync dump-pipeline stubs ─────────────────────────────────────────
  # pg-sync sidecar calls these during boot to register/track CSV dump
  # progress. In relay mode there's no real bitmap-engine to load into;
  # we return shapes that make pg-sync skip the dump phase entirely and
  # advance to the steady-state ops poller (which is the actual source
  # of /api/indexes/{index}/ops POSTs we want to capture).
  #
  # `bitdex_client::register_dump` parses the body as `serde_json::Value`
  # and only logs it on success (no field access). Returning `{}` is
  # enough to satisfy the parser. `get_dumps` calls
  # `.get("all_complete").as_bool()` — returning `true` makes pg-sync
  # treat all phases as already done. `signal_dump_loaded` ignores body
  # entirely; just needs status 2xx.

  - path: /api/indexes/{index}/dumps
    methods: [PUT]
    auth: loopback_or_bearer
    response:
      status: 200
      headers: { Content-Type: application/json }
      body: '{"name":"relay-stub","status":"complete"}'

  - path: /api/indexes/{index}/dumps
    methods: [GET]
    auth: loopback_or_bearer
    response:
      status: 200
      headers: { Content-Type: application/json }
      body: '{"dumps":[],"all_complete":true}'

  - path: /api/indexes/{index}/dumps/{dump_name}/loaded
    methods: [POST]
    auth: loopback_or_bearer
    response:
      status: 200
      headers: { Content-Type: application/json }
      body: '{}'

  # `/stats` is hit by pg-sync's healthcheck loop. Empty stats body
  # parses fine.
  - path: /api/indexes/{index}/stats
    methods: [GET]
    auth: none
    response:
      status: 200
      headers: { Content-Type: application/json }
      body: '{"alive_count":0,"slot_counter":0,"docstore_size_bytes":0}'

  # Cursor read/write — pg-sync's ops poller reads its own cursor on
  # boot and writes after each batch. Read returns 0; write accepts.
  - path: /api/indexes/{index}/cursors/{cursor_name}
    methods: [GET]
    auth: loopback_or_bearer
    response:
      status: 200
      headers: { Content-Type: application/json }
      body: '{"value":0}'

  - path: /api/indexes/{index}/cursors/{cursor_name}
    methods: [PUT]
    auth: loopback_or_bearer
    response:
      status: 200
      headers: { Content-Type: application/json }
      body: '{}'

# Capture is OFF by default. Operators enable per relay window if they need
# guaranteed durable record. When enabled:
#   - Subscribes to each channel's broadcast (counts toward receiver_count
#     so the emit gate fires even with zero SSE subscribers).
#   - Writes one NDJSON line per event under `dir`.
#   - Rotates on `rotate_bytes`; gzips the rotated file in a background task.
#   - Enforces `max_total_bytes` by deleting oldest .gz files.
capture:
  enabled: false
  dir: /var/lib/bitdex-relay
  rotate_bytes: 268435456       # 256 MiB
  gzip_after_rotate: true
  max_total_bytes: 21474836480  # 20 GiB hard cap on capture dir
  fsync: per_rotation
  file_mode: 0o640
