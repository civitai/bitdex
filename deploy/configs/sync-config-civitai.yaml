# Sync V2 — Civitai Sync Config (Draft v2)
#
# Read by bitdex-sync (sidecar). Defines PG tables, dump phases, and triggers.
# BitDex server does NOT read this file — it receives dump instructions
# via PUT /dumps request body, populated by bitdex-sync from this config.
#
# Conventions:
# - Fields reference column names from COPY query (not indices)
# - When source column name == target field name, use shorthand: `fields: [fieldName]`
# - sets_alive defaults to false (omit when false)
# - computed_fields: any derived/computed value (from expressions, lookups, bitfields)
# - Trigger expressions use {column} templates: {publishedAt} resolves to
#   OLD."publishedAt" / NEW."publishedAt" for remove/set ops respectively

index: civitai

postgres:
  connection_string: "${DATABASE_URL}"
  stage_dir: /data/load_stage

clickhouse:
  connection_string: "${CLICKHOUSE_URL}"

bitdex:
  url: "http://localhost:3000"
  index: civitai

# -----------------------------------------------------------------------
# Dump phases — processed in order during boot
# -----------------------------------------------------------------------

dump_phases:

  # Phase 1: Images (14GB, primary entity — loaded first for earliest query readiness)
  # NOTE: Images before tags so the server can serve real queries while
  # the 63GB tags phase is still downloading/processing.
  - name: images
    table: Image
    # [PR-B3] sortAt: emitted directly as epoch SECONDS (bigint) so it lands in
    # the sortAt sort layers with no ms conversion (data_schema fallback: sortAt,
    # which does NOT apply ms_to_seconds). TYPE-CORRECT: every GREATEST operand
    # is a TIMESTAMP, and extract(epoch ...)::bigint wraps the whole expression.
    #
    # NO-BACKFILL DECISION (2026-07-16): the dump computes sortAt as a PURE
    # GREATEST(post.publishedAt, scannedAt, createdAt) — it NEVER reads
    # i."sortAt". A COALESCE(i."sortAt", GREATEST(...)) shape was tried first and
    # is WRONG here: with no backfill, ~92M historical Image rows have a
    # NOT-NULL i."sortAt" that is stale `now()`-at-migration garbage (measured on
    # prod: 88.1% mismatch vs. the correct GREATEST value, clustering ≈
    # createdAt). COALESCE prefers the column when non-null, so it would have
    # ingested that garbage for ~92M rows. Only rows the model-share
    # `image_sort_at_before` trigger has WRITTEN THROUGH (post-cutover
    # inserts/updates) have a trustworthy column value — the dump has no way to
    # distinguish "trigger-written" from "stale migration default" from SQL
    # alone, so it must ignore the column entirely and always recompute.
    #
    # PINNED PAIRING (do not decouple without re-reading this comment): the
    # STEADY-STATE ops emission expression below (shared_ops_fields:
    # [sortAtUnix], `COALESCE(NEW."sortAt", GREATEST(...))`) is UNCHANGED and
    # stays COALESCE-shaped — trusting the column there is safe ONLY because
    # `image_sort_at_before` (model-share BEFORE INSERT OR UPDATE trigger)
    # recomputes NEW."sortAt" on every write that reaches PG, so any row the ops
    # trigger fires on has a correct-on-write column by construction. The dump
    # has no such guarantee (it reads rows regardless of whether they were ever
    # touched post-cutover) — ops emission may trust the column ONLY because
    # image_sort_at_before recomputes it on every write; the dump must NEVER
    # trust it (92M pre-trigger rows are stale).
    copy_query: >
      COPY (SELECT i.id, i.url, i."nsfwLevel", i.hash, i.flags, i.type::text,
                   i."userId", i."blockedFor",
                   extract(epoch from i."scannedAt")::bigint as "scannedAtSecs",
                   extract(epoch from i."createdAt")::bigint as "createdAtSecs",
                   extract(epoch from
                     GREATEST((SELECT p."publishedAt" FROM "Post" p WHERE p.id = i."postId"),
                              i."scannedAt", i."createdAt"))::bigint as "sortAt",
                   i."postId", i.width, i.height
            FROM "Image" i)
      TO STDOUT WITH (FORMAT csv)
    columns: [id, url, nsfwLevel, hash, flags, type, userId, blockedFor, scannedAtSecs, createdAtSecs, sortAt, postId, width, height]
    slot_field: id
    sets_alive: true
    fields:
      - nsfwLevel
      - { column: type, target: type }
      - userId
      - postId
      - blockedFor
      - { column: url, target: url }          # doc-only
      - { column: hash, target: hash }        # doc-only
      - width                                  # doc-only
      - height                                 # doc-only
      # sortAt sort layers (SECONDS). Direct mapping — the dump sort path reads
      # this i64 as-is (data_schema ms_to_seconds is an ops-path concern, not the
      # dump). Replaces the former `computed: greatest(existedAt, publishedAt)`
      # sort field in civitai-index.yaml (removed same-deploy, [PR-M5]).
      - { column: sortAt, target: sortAt }
    computed_fields:
      # From flags bitfield:
      - target: hasMeta
        expression: "(flags >> 13) & 1 == 1 && (flags >> 2) & 1 == 0"
      - target: onSite
        expression: "(flags >> 14) & 1 == 1"
      - target: minor
        expression: "(flags >> 3) & 1 == 1"
      - target: poi
        expression: "(flags >> 4) & 1 == 1"
      # Sort fields computed from CSV columns:
      - target: existedAt
        expression: "max(scannedAtSecs, createdAtSecs)"
      - target: id
        expression: "id"  # slot ID as sort value
    enrichment:
      - lookup: posts.csv
        table: Post
        copy_query: >
          COPY (SELECT id,
                       extract(epoch from "publishedAt")::bigint as "publishedAtSecs",
                       availability::text,
                       "modelVersionId",
                       "model3dId"
                FROM "Post")
          TO STDOUT WITH (FORMAT csv)
        columns: [id, publishedAtSecs, availability, modelVersionId, model3dId]
        key: id
        join_on: postId
        fields:
          - { column: publishedAtSecs, target: publishedAt }
          - { column: availability, target: availability }
          - { column: modelVersionId, target: postedToId }
          # model3dId (Post column, Meili parity). Enriched onto each image via
          # the postId join, mirroring the steady-state Image trigger's
          # model3dId INSERT-read subselect.
          - { column: model3dId, target: model3dId }
        computed_fields:
          - target: isPublished
            expression: "publishedAtSecs != null"
    # sortAt is now INGESTED (copy_query column above), not engine-computed.
    # The old `computed: greatest(existedAt, publishedAt)` sort field is removed
    # from civitai-index.yaml in the SAME deploy as this emission flip ([PR-M5]:
    # computed and ingested must never coexist).

  # Phase 2: Tags (63GB, largest — loaded after images so server can serve queries)
  - name: tags
    table: TagsOnImageNew
    copy_query: >
      COPY (SELECT "tagId", "imageId", "attributes"
            FROM "TagsOnImageNew")
      TO STDOUT WITH (FORMAT csv)
    columns: [tagId, imageId, attributes]
    slot_field: imageId
    fields:
      - { column: tagId, target: tagIds }
    filter: "(attributes >> 10) & 1 = 0"  # skip disabled tags

  # Phase 3: Resources (820MB)
  - name: resources
    table: ImageResourceNew
    copy_query: >
      COPY (SELECT "imageId", "modelVersionId", detected
            FROM "ImageResourceNew")
      TO STDOUT WITH (FORMAT csv)
    columns: [imageId, modelVersionId, detected]
    slot_field: imageId
    fields:
      - { column: modelVersionId, target: modelVersionIds }
    computed_fields:
      - target: modelVersionIdsManual
        expression: "detected == false"
        value: modelVersionId
    enrichment:
      - lookup: model_versions.csv
        table: ModelVersion
        copy_query: >
          COPY (SELECT id, "baseModel", "modelId"
                FROM "ModelVersion")
          TO STDOUT WITH (FORMAT csv)
        columns: [id, baseModel, modelId]
        key: id
        join_on: modelVersionId
        fields:
          - { column: baseModel, target: baseModel }
        enrichment:
          - lookup: models.csv
            table: Model
            copy_query: >
              COPY (SELECT id, poi, type::text
                    FROM "Model")
              TO STDOUT WITH (FORMAT csv)
            columns: [id, poi, type]
            key: id
            join_on: modelId
            fields:
              - { column: poi, target: poi }
            filter: "type = 'Checkpoint'"

  # Phase 4: Tools (50MB)
  - name: tools
    table: ImageTool
    copy_query: >
      COPY (SELECT "toolId", "imageId" FROM "ImageTool")
      TO STDOUT WITH (FORMAT csv)
    columns: [toolId, imageId]
    slot_field: imageId
    fields:
      - { column: toolId, target: toolIds }

  # Phase 5: Techniques (71MB)
  - name: techniques
    table: ImageTechnique
    copy_query: >
      COPY (SELECT "techniqueId", "imageId" FROM "ImageTechnique")
      TO STDOUT WITH (FORMAT csv)
    columns: [techniqueId, imageId]
    slot_field: imageId
    fields:
      - { column: techniqueId, target: techniqueIds }

  # Phase 6: Metrics (1.4GB, from ClickHouse, TAB-separated)
  # 2026-07-17: `FROM image_metrics` was STALE (table gone; CH 404
  # UNKNOWN_IDENTIFIER on the first real boot-dump under this file) — this
  # repo copy had drifted from the deployed talos ConfigMap, which already
  # used entityMetricDailyAgg_v2. Now matched to deployed reality.
  - name: metrics
    source: clickhouse
    query: >
      SELECT entityId AS imageId,
      sumIf(total, metricType IN ('Like','Heart','Laugh','Cry')) AS reactionCount,
      sumIf(total, metricType = 'commentCount') AS commentCount,
      sumIf(total, metricType = 'Collection') AS collectedCount
      FROM entityMetricDailyAgg_v2
      WHERE entityType = 'Image' AND entityId >= {id_lo} AND entityId < {id_hi}
      GROUP BY entityId
    format: tsv
    slot_field: imageId
    fields: [reactionCount, commentCount, collectedCount]

# -----------------------------------------------------------------------
# Steady-state triggers — PG triggers that write to BitdexOps
# -----------------------------------------------------------------------
# Trigger name: bitdex_{table}_{config_hash8}
# Expressions use {column} templates that resolve to OLD/NEW for remove/set ops.

triggers:

  - table: Image
    slot_field: id
    sets_alive: true
    on_delete: true
    # [PR-B4-v2] PINNED UNIT STATEMENT (emission + query chains — see also civitai-index.yaml):
    #   EMISSION: ops emit field `sortAt` (the TARGET name) in SECONDS. This was
    #   CORRECTED 2026-07-18: the original design emitted `sortAtUnix` in ms,
    #   assuming the data_schema `sortAtUnix -> sortAt` mapping applied to op
    #   field names — IT DOES NOT. data_schema renames apply to DOCUMENT keys
    #   (dump/insert path) only; op Set/Remove fields are resolved raw against
    #   filter/sort TARGET names (ops_processor.rs process_set_op), and unknown
    #   fields are SILENTLY IGNORED. Every other field always emitted target
    #   names — sortAtUnix was the one deviation, and its ops were dropped in
    #   prod for ~5h until caught by a single-op experiment. Target-name seconds
    #   is now the rule. The dormant sortAtUnix->sortAt doc mapping remains for
    #   the dump path only. The dump path emits a `sortAt` CSV column in SECONDS
    #   (doc path — mapping applies). Both paths converge on SECONDS everywhere.
    #   QUERY: the Civitai builder sends `sortAtUnix Gte <seconds>`
    #   (image.service.ts:3940). That clause is resolved by the time-bucket
    #   manager (civitai-index.yaml time_buckets.filter_field: sortAtUnix,
    #   sort_field: sortAt): the threshold is unit-normalized by ts_secs_u64
    #   (src/query.rs:316 — value already seconds, so passes through unchanged)
    #   and snapped to a bucket built from the sortAt SECONDS layers
    #   (src/executor.rs Gt/Gte ~L668, Lt/Lte ~L702). No ingested `sortAtUnix`
    #   filter field exists — the clause only ever hits the sort layers via the
    #   bucket. Net: SECONDS on the query side; MILLISECONDS only on the wire,
    #   divided back on ingest. The builder's seconds-Gte is CORRECT both before
    #   this change (sortAt computed) and after (sortAt ingested).
    #
    # sortAt is emitted via the SHARED bitdex_image_sortat_ops() function so
    # the W1-3 re-emitter re-asserts the identical value (shape parity). SECONDS
    # with a COALESCE(NEW."sortAt", GREATEST(...)) shape — trusting
    # NEW."sortAt" here is UNCHANGED from before the no-backfill decision and
    # stays COALESCE-shaped, because it is SAFE for a different reason than the
    # dump: the model-share `image_sort_at_before` BEFORE INSERT OR UPDATE
    # trigger recomputes Image.sortAt = GREATEST(post.publishedAt, scannedAt,
    # createdAt) on EVERY write that reaches PG, so by the time this trigger
    # fires, NEW."sortAt" is already correct-on-write (COALESCE's GREATEST
    # fallback only exists for the pre-cutover window / defense-in-depth, not for
    # 92M-stale-row coverage the way the old dump reasoning assumed).
    #
    # PINNED PAIRING — do not decouple without re-reading the dump's copy_query
    # comment above: ops emission may trust the column ONLY because
    # image_sort_at_before recomputes it on every write; the dump must NEVER
    # trust it (92M pre-trigger rows are stale). Expression is byte-identical to
    # the W1-1 codegen pin (trigger_gen.rs SORTAT_EXPR).
    shared_ops_fields: [sortAt]
    track_fields:
      - nsfwLevel
      - { column: type, expression: "{type}::text" }
      - userId
      - postId
      - blockedFor
      - url
      - hash
      - width
      - height
      - 'COALESCE(extract(epoch from {sortAt})::bigint, GREATEST(extract(epoch from (SELECT p."publishedAt" FROM "Post" p WHERE p.id = {postId}))::bigint, extract(epoch from {scannedAt})::bigint, extract(epoch from {createdAt})::bigint)) as sortAt'
    computed_fields:
      - target: hasMeta
        expression: "({flags} >> 13) & 1 = 1 AND ({flags} >> 2) & 1 = 0"
      - target: onSite
        expression: "({flags} >> 14) & 1 = 1"
      - target: minor
        expression: "({flags} >> 3) & 1 = 1"
      - target: poi
        expression: "({flags} >> 4) & 1 = 1"
      # existedAt = GREATEST(scannedAt, createdAt) — required for sortAt computation.
      # Without this, new images get sortAt=0 because existedAt is never emitted.
      - target: existedAt
        expression: "GREATEST(extract(epoch from {scannedAt})::bigint, extract(epoch from {createdAt})::bigint)"
      # Inherit the post's publish state at insert (audit 2026-07-07, Mode B).
      # Images added to an ALREADY-published post previously never received
      # publishedAt: the Post fan-out only fires on Post row changes, and the
      # publish-time fan-out ran before the image existed — so the doc stayed
      # publishedAt=0 / isPublished=false forever. The subquery resolves the
      # parent Post's publishedAt at insert (and re-resolves if the image moves
      # posts); the isPublished shadow and sortAt recompute follow server-side
      # from the Set, including the deferred branch when the post is scheduled
      # ahead. NULL for draft posts → explicit isPublished=false shadow.
      - target: publishedAt
        expression: '(SELECT extract(epoch from p."publishedAt")::bigint FROM "Post" p WHERE p.id = {postId})'
      # availability + postedToId share the same structural gap as publishedAt:
      # their only steady-state writer is the Post fan-out, which never fires
      # for images added to an unchanged post. Inherit both at insert too.
      - target: availability
        expression: '(SELECT p."availability"::text FROM "Post" p WHERE p.id = {postId})'
      - target: postedToId
        expression: '(SELECT p."modelVersionId" FROM "Post" p WHERE p.id = {postId})'
      # model3dId (Post column, indexed for Meili parity). INSERT-reads the
      # parent Post via subselect, exactly like publishedAt's INSERT branch, and
      # re-resolves on UPDATE-when-changed (e.g. if the image moves posts).
      # NOT carried on the Post per-image fan-out below: model3dId is set at
      # post-CREATE, before any image rows exist, and does not change over a
      # post's lifetime — so the Image INSERT-read fully covers it and a Post
      # fan-out entry would only add a redundant (disjointness-breaking) writer.
      - target: model3dId
        expression: '(SELECT p."model3dId" FROM "Post" p WHERE p.id = {postId})'

  - table: TagsOnImageNew
    slot_field: imageId
    field: tagIds
    value_field: tagId
    filter: '({attributes} >> 10) & 1 = 0'

  - table: ImageTool
    slot_field: imageId
    field: toolIds
    value_field: toolId

  - table: ImageTechnique
    slot_field: imageId
    field: techniqueIds
    value_field: techniqueId

  - table: ImageResourceNew
    slot_field: imageId
    field: modelVersionIds
    value_field: modelVersionId
    computed_fields:
      - target: modelVersionIdsManual
        expression: "{detected} = false"
        value: "{modelVersionId}"

  # Post publish fan-out — PER-IMAGE MATERIALIZED (W1-1 / PR #325).
  # Replaces the old `type: fan_out` queryOpSet ("postId eq {id}") that BitDex
  # resolved against its own moving index at apply time (FD #69397: never checked
  # what it matched). `fan_out_per_row` instead enumerates the Post's Image rows
  # TRANSACTIONALLY in PG — INSERT INTO "BitdexOps" SELECT i.id, <ops> FROM
  # "Image" i WHERE i."postId" = NEW.id — so the match set is fixed inside the
  # publishing txn and cannot be partial/early/re-resolved on WAL replay.
  #
  # [PR-M1] RETAINS the full payload {publishedAt, availability, postedToId}.
  # publishedAt drives BOTH deferred-alive activation stamping AND the isPublished
  # shadow — do NOT drop it (design §2.2 Options A/B that delete publishedAt are
  # PARKED). Only Phase 2 ever removes availability/postedToId.
  #
  # [PR-m2] These three fields are DISJOINT from sortAtUnix (the only new field
  # the Image trigger emits): the Post fan-out never emits sortAtUnix, so the two
  # writers never collide on one image → op_dedup has nothing to LIFO-resolve
  # nondeterministically. (The Image trigger DOES also INSERT-read
  # publishedAt/availability/postedToId for the "image added to an already-
  # published post" case, but that is temporally separated and same-valued — see
  # test_post_fanout_disjoint_from_sortatunix in sync_config.rs.)
  - table: Post
    type: fan_out_per_row
    rows_from: { table: Image, fk: postId, slot: id, parent_key: id }
    track_fields:
      - { column: publishedAt, target: publishedAt, expression: "extract(epoch from {publishedAt})::bigint" }
      # Null handling: if {publishedAt} is NULL, the UPDATE branch emits a remove op
      # (OLD non-null, NEW null). NEW non-null → set. Fan-out reaches every child image.
      - { column: availability, target: availability, expression: "{availability}::text" }
      - { column: modelVersionId, target: postedToId }

  - table: ModelVersion
    type: fan_out
    query: "modelVersionIds eq {id}"
    track_fields:
      - { column: baseModel, target: baseModel }
    join: 'INNER JOIN "Model" ON "Model".id = "ModelVersion"."modelId"'
    filter: '"Model".type = ''Checkpoint'''

  - table: Model
    type: fan_out
    expression: 'SELECT json_agg(mv.id) as ids FROM "ModelVersion" mv WHERE mv."modelId" = {id}' # @justin: added the missing cast to the correct name to be used inside of the query. I guess we'll have to correctly parse JSON or whatever in our query handler before handing it to the BitdexOps endpoint.
    # @adam:* Right — the trigger function parses the json_agg result array and constructs the queryOpSet with `modelVersionIds in [id1, id2, ...]`. The trigger_gen code handles this: it detects the expression returns JSON, parses it to i64 array, formats into the query template. Straightforward since we control the SQL.
    # expression replaces the default slot resolution. {id} → NEW.id.
    # Result is an array of MV ids, used in query below.
    query: "modelVersionIds in [{ids}]"
    track_fields:
      - poi

# -----------------------------------------------------------------------
# Dump request body schema (what bitdex-sync sends to BitDex)
# -----------------------------------------------------------------------
# PUT /api/indexes/{index}/dumps
# {
#   "name": "tags-a1b2c3d4",
#   "csv_path": "/data/load_stage/tags.csv",
#   "format": "csv",
#   "slot_field": "imageId",
#   "sets_alive": false,
#   "fields": [
#     { "column": "tagId", "target": "tagIds" }
#   ],
#   "filter": "(attributes >> 10) & 1 = 0",
#   "computed_fields": [],
#   "enrichment": [
#     {
#       "csv_path": "/data/load_stage/posts.csv",
#       "key": "id",
#       "join_on": "postId",
#       "fields": [...],
#       "computed_fields": [...],
#       "enrichment": [...]
#     }
#   ]
# }
