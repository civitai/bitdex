name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run lib tests
        run: cargo test --lib

      - name: Run pg-sync tests
        run: cargo test --features pg-sync --lib

      - name: Check benchmarks compile
        run: cargo bench --no-run 2>/dev/null || true

      - name: Check server compiles
        run: cargo check --features server

      # Compile guard for the prod release feature set. The Docker image
      # builds with `--features server,pg-sync,heap-prof`, which enables
      # the jemalloc global allocator and the jemalloc stats scrape path.
      # Enabling `heap-prof` pulls in `tikv-jemalloc-ctl` features that
      # change public signatures (e.g. `epoch::advance()` becomes
      # `Result<u64, _>` instead of `Result<(), _>`), and breakage in
      # that code path is invisible on Windows/macOS because
      # tikv-jemalloc-sys cannot build jemalloc without a Unix `sh`.
      #
      # This step is the only pre-merge gate that exercises that code
      # path and caught a v1.0.158 build break retrospectively — keep
      # it in every PR run.
      - name: Check release feature set compiles (heap-prof)
        run: cargo check --features server,pg-sync,heap-prof --bin bitdex-server
