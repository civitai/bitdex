# Low memory preset — reduce memory footprint for constrained environments.
# Target: smaller pods, dev servers, or memory-limited deployments.
#
# Legend: [hot] = hot-swappable via PATCH /config, [restart] = requires server restart

[metadata]
name = "low-memory"
description = "Reduced memory — 256MB unified, 512MB doc, 5K bound target"

[cache]
bound_target_size = 5000    # [hot]
bound_max_size = 10000      # [hot]
bound_max_count = 50        # [hot]
max_entries = 5000          # [hot]

[unified_cache]
max_bytes = 268435456       # [restart] 256 MB

[doc_cache]
max_bytes = 536870912       # [restart] 512 MB
