[workspace]
members = [".", "scratch"]
default-members = ["."]

[package]
name = "bitdex-v2"
version = "1.0.190-jemalloc"
edition = "2021"
license = "MIT"
description = "Purpose-built in-memory bitmap index engine"
keywords = ["bitmap", "index", "database", "search", "roaring"]

[features]
default = []
server = ["dep:axum", "dep:tower", "dep:tower-http", "dep:tokio", "dep:tokio-util", "dep:prometheus", "dep:serde_yaml", "dep:tokio-stream", "dep:flate2"]
loadtest = ["ureq"]
replay = ["ureq"]
pg-sync = ["dep:sqlx", "dep:clap", "dep:reqwest", "dep:chrono", "dep:tokio", "dep:axum", "dep:tower-http", "dep:futures-core", "dep:futures-util", "dep:bytes", "dep:serde_yaml"]
simd = ["roaring/simd"]
dump-timing = []
heap-prof = ["dep:tikv-jemallocator", "dep:tikv-jemalloc-ctl"]
serde_yaml = ["dep:serde_yaml"]

[dependencies]
# Bitmap indexes
roaring = "0.10"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Async runtime (optional — only needed for HTTP server and pg-sync)
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net", "fs", "io-util"], optional = true }
tokio-util = { version = "0.7", features = ["io"], optional = true }
tokio-stream = { version = "0.1", features = ["sync"], optional = true }

# Concurrency
dashmap = "6"
parking_lot = "0.12"
crossbeam-channel = "0.5"
arc-swap = "1"
ahash = { version = "0.8", features = ["serde"] }

# CRC32 checksums (bucket diff log, shard store)
crc32fast = "1"

# Serialization (document store)
rmp-serde = "1"
zstd = "0.13"
tar = "0.4"

# Parallel sort / iteration
rayon = "1"

# Allocator (handles concurrent allocation much better than Windows CRT)
rpmalloc = "0.2"

# Heap profiling (optional — jemalloc with profiling support)
# `stats` is required for tikv_jemalloc_ctl::stats::{allocated, resident}
# to work at runtime. Without it, tikv-jemalloc-sys passes `--disable-stats`
# to the jemalloc configure script and every `stats::*::read()` call fails
# silently, leaving `bitdex_jemalloc_*_bytes` metrics at zero. `profiling`
# is also kept so heap profiles can be dumped via `MALLOC_CONF=prof:true`.
tikv-jemallocator = { version = "0.6", features = ["profiling", "stats"], optional = true }
tikv-jemalloc-ctl = { version = "0.6", features = ["stats"], optional = true }

# HTTP server (optional — only needed for HTTP server)
axum = { version = "0.8", optional = true }
tower = { version = "0.5", features = ["limit"], optional = true }
tower-http = { version = "0.6", features = ["cors"], optional = true }
prometheus = { version = "0.13", features = ["process"], optional = true }

# HTTP client (optional — only needed for loadtest binary)
ureq = { version = "2", optional = true }

# PG sync dependencies (optional — only needed for pg-sync binary)
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "tls-rustls", "chrono"], optional = true }
clap = { version = "4", features = ["derive"], optional = true }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false, optional = true }
chrono = { version = "0.4", optional = true }
futures-core = { version = "0.3", optional = true }
futures-util = { version = "0.3", optional = true }
bytes = { version = "1", optional = true }

# Memory-mapped files (slot arena for bulk loading)
memmap2 = "0.9"

# RNG (used by benchmark and loadtest binaries)
rand = "0.8"

# Error handling
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_yaml = { version = "0.9.34", optional = true }

# Gzip post-rotation for relay capture files
flate2 = { version = "1", optional = true }

[dev-dependencies]
# Property-based testing
proptest = "1"

# Benchmarking
criterion = { version = "0.5", features = ["html_reports"] }

# Test utilities
rand = "0.8"
tempfile = "3"
memmap2 = "0.9"
# Serialize tests that share global state (flush/merge thread pools, file
# system tempdirs racing under heavy parallelism). Use `#[serial]` on
# concurrent_engine save/restore tests to avoid wait_for_flush timeouts
# under default `--test-threads`.
serial_test = "3"
# axum router oneshot testing pattern (relay smoke tests)
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"


# Fast release builds for development — `cargo build --profile fast`
# Good perf (~90% of full release), much faster compile times.
[profile.fast]
inherits = "release"
opt-level = 3
lto = "thin"        # thin LTO: most of the benefit, fraction of the cost
codegen-units = 4   # parallel codegen (vs 1 for full release)
strip = false       # keep symbols for profiling/debugging

# Full release builds for distribution — `cargo build --release`
# Maximum optimization, slow to compile. Use for final binaries only.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[[bench]]
name = "engine_bench"
harness = false

[[bench]]
name = "radix_sort_bench"
harness = false

[[bench]]
name = "docstore_merge"
harness = false

[[bench]]
name = "bitmap_stream"
harness = false

[[bench]]
name = "slot_loader"
harness = false

[[bench]]
name = "columnar_loader"
harness = false

[[bench]]
name = "bound_store_bench"
harness = false

[[bin]]
name = "bitdex-benchmark"
path = "src/bin/benchmark.rs"

[[bin]]
name = "bitdex-server"
path = "src/bin/server.rs"
required-features = ["server"]

[[bin]]
name = "bitdex-loadtest"
path = "src/bin/loadtest.rs"
required-features = ["loadtest"]

[[bin]]
name = "bitdex-sync"
path = "src/bin/pg_sync.rs"
required-features = ["pg-sync"]

[[bin]]
name = "bitdex-replay"
path = "src/bin/replay.rs"
required-features = ["replay"]

[[bin]]
name = "rebuild_bench"
path = "src/bin/rebuild_bench.rs"
required-features = ["server"]

[[example]]
name = "load_from_csv"
path = "examples/load_from_csv.rs"
required-features = ["pg-sync"]

[profile.profiling]
inherits = "release"
debug = false
strip = false
